<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="sub-container">
                 <div class="image-holder">
                     <img class="image1">
                 </div>
             
                 <div class="main-text">
                     <h2 class="white">Equilibrium #3429</h2>
                     <p class="light-color">Our Equilibrium collection promotes balance and calm</p>
                 </div>
            </div>
                 
            <div class="value-time">
                <div class="shape1">
                    <img src="icon-ethereum.svg" alt="etherneum icon" class="small">
                    <p class="light">0.041ETH</p>
                </div>
                <div class="shape2">
                    <img src="icon-clock.svg" alt="icon of a clock" class="small">
                    <p class="light-color">3 days left</p>
                </div>
            </div>
        
            <div class="profile">
                <div>
                    <img src="tonystark vibe.jpg" alt="My profile picture" class="image2">
                </div>

                <div class="divider"></div>
                    <p class="light-color">Creation of</p>
                    <p class="white">LordScientist</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
